<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가계부 · 식비 & 생활비</title>
<link rel="stylesheet" href="style.css?v=20261017-7">
</head>
<body>
<div class="wrap">
  <div class="left">
    <div class="app-title">
      <div class="title-row">
        <span>가계부 · 식비 & 생활비</span>
        <div class="cloud-status wait" id="cloud-status">연결 준비 중…</div>
      </div>
      <div class="app-sub">가족 실시간 공용 가계부</div>
    </div>

    <!-- 월별 보기 -->
    <div class="section">
      <div class="section-title">조회 기간</div>
      <div class="month-nav">
        <button type="button" onclick="moveMonth(-1)" aria-label="이전 달">‹</button>
        <input type="month" id="monthFilter" onchange="render()">
        <button type="button" onclick="moveMonth(1)" aria-label="다음 달">›</button>
      </div>
      <button class="tool month-all" type="button" onclick="showAllMonths()">전체 기간 보기</button>
    </div>

    <!-- 지출 요약 & 예산 설정 -->
    <div class="section">
      <div class="summary-header">
        <div class="section-title" style="margin-bottom:0">요약</div>
        <button class="budget-toggle-btn" type="button" onclick="toggleBudgetEdit()">예산 변경</button>
      </div>
      
      <div id="budget-edit-box" class="budget-edit-box" style="display:none">
        <input type="number" id="budgetInput" value="500000" placeholder="목표 예산(원)">
        <button class="tool" onclick="setBudget()">저장</button>
      </div>

      <div class="stats">
        <div class="stat"><div class="stat-label">예산</div><div class="stat-value blue" id="s-budget">500,000</div></div>
        <div class="stat"><div class="stat-label">사용액</div><div class="stat-value red" id="s-used">0</div></div>
        <div class="stat"><div class="stat-label">잔액</div><div class="stat-value green" id="s-remain">500,000</div></div>
      </div>
      <div class="bar-row" style="margin-top:12px">
        <div class="bar-lbl" id="bar-status-lbl">소진율</div>
        <div class="bar-bg"><div class="bar-fill bu" id="bar-fill" style="width:0%"></div></div>
        <div class="bar-pct" id="bar-pct">0%</div>
      </div>
    </div>

    <!-- 문자 인식 -->
    <div class="section">
      <div class="section-title">문자 붙여넣기 (현대 / 롯데)</div>
      <textarea class="sms-box" id="sms" placeholder="카드 승인 문자를 붙여넣으면 즉시 인식합니다" oninput="parseSms()"></textarea>
      <div class="sms-hint">롯데 / 현대카드 승인 및 취소 문자 자동 파싱</div>
      <div id="parsed-result"></div>
    </div>

    <!-- 직접 내역 입력 -->
    <div class="section" style="flex:1">
      <div class="section-title">직접 입력</div>
      <div class="field-row">
        <select id="type" onchange="togglePayment()"><option value="out">지출</option><option value="inc">수입(환급)</option></select>
        <div id="payment-row" style="flex:1;display:flex">
          <select id="payment" style="width:100%">
            <option value="현대">현대</option><option value="롯데">롯데</option><option value="현금">현금</option>
            <option value="삼성">삼성</option><option value="신한">신한</option><option value="국민">국민</option>
            <option value="하나">하나</option><option value="우리">우리</option><option value="기타">기타</option>
          </select>
        </div>
      </div>
      <div class="field-row"><input type="text" id="merchant" placeholder="거래처 (예: 쿠팡)"></div>
      <div class="field-row"><input type="number" id="amount" placeholder="금액" oninput="clearErr()"><input type="date" id="date"></div>
      <div class="err" id="err"></div>
      <button class="add-btn" onclick="addItem()">내역 추가</button>
    </div>
  </div>

  <div class="right">
    <div class="list-header">
      <span class="list-title">내역</span>
      <div class="list-head-right">
        <select class="filter" id="sortBy" onchange="render()">
          <option value="date-desc">날짜 최신순</option>
          <option value="date-asc">날짜 과거순</option>
          <option value="amt-desc">금액 높은순</option>
          <option value="amt-asc">금액 낮은순</option>
        </select>
        <span class="list-count" id="list-count">0건</span>
      </div>
    </div>
    <div id="list"></div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
<script src="script.js?v=20261017-8"></script>
</body>
</html>
