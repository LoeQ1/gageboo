<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가계부 · 식비 & 생활비</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="left">
    <div class="app-title">가계부 · 식비 & 생활비
      <div class="app-sub">Supabase 공용 데이터로 가족이 함께 봐요</div>
      <div class="cloud-status wait" id="cloud-status">Supabase 연결 준비 중…</div>
    </div>

    <div class="section">
      <div class="section-title">월별 보기</div>
      <div class="month-nav">
        <button type="button" onclick="moveMonth(-1)" aria-label="이전 달">‹</button>
        <input type="month" id="monthFilter" onchange="render()">
        <button type="button" onclick="moveMonth(1)" aria-label="다음 달">›</button>
      </div>
      <button class="tool month-all" type="button" onclick="showAllMonths()">전체 기간 보기</button>
    </div>

    <div class="section">
      <div class="section-title">예산 설정</div>
      <div class="budget-row">
        <input type="number" id="budgetInput" value="500000">
        <button class="tool" onclick="setBudget()">설정</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">요약</div>
      <div class="stats">
        <div class="stat"><div class="stat-label">예산</div><div class="stat-value blue" id="s-budget">500,000</div></div>
        <div class="stat"><div class="stat-label">사용액</div><div class="stat-value red" id="s-used">0</div></div>
        <div class="stat"><div class="stat-label">잔액</div><div class="stat-value green" id="s-remain">500,000</div></div>
      </div>
      <div class="mini-stats">
        <div class="mini-stat">식비<b id="s-food">0원</b></div>
        <div class="mini-stat">생활비<b id="s-life">0원</b></div>
      </div>
      <div class="bar-row">
        <div class="bar-lbl">사용</div>
        <div class="bar-bg"><div class="bar-fill bu" id="bar-used" style="width:0%"></div></div>
        <div class="bar-pct" id="bar-used-pct">0%</div>
      </div>
      <div class="bar-row">
        <div class="bar-lbl">잔액</div>
        <div class="bar-bg"><div class="bar-fill br" id="bar-remain" style="width:100%"></div></div>
        <div class="bar-pct" id="bar-remain-pct">100%</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">CSV 데이터</div>
      <div class="tools">
        <button class="tool" onclick="document.getElementById('csvFile').click()">CSV 불러오기</button>
        <button class="tool" onclick="exportCsv()">CSV로 저장</button>
      </div>
      <input type="file" id="csvFile" accept=".csv,text/csv" hidden onchange="importCsv(event)">
      <div class="import-note">열: 날짜, 시간, 결제처, 금액(원), 상태, 결제수단, 분류<br>분류가 <b>식비</b> 또는 <b>생활비</b>인 행만 가져옵니다.</div>
      <div class="import-msg" id="import-msg"></div>
    </div>

    <div class="section">
      <div class="section-title">문자 붙여넣기</div>
      <textarea class="sms-box" id="sms" placeholder="카드 승인 문자를 여기에 붙여넣으세요" oninput="parseSms()"></textarea>
      <div class="sms-hint">붙여넣으면 자동으로 인식해요</div>
      <div id="parsed-result"></div>
    </div>

    <div class="section" style="flex:1">
      <div class="section-title">내역 입력</div>
      <div class="field-row">
        <select id="desc"><option value="식비">식비</option><option value="생활비">생활비</option></select>
        <select id="type" onchange="togglePayment()"><option value="out">지출</option><option value="inc">수입</option></select>
      </div>
      <div class="field-row" id="payment-row">
        <select id="payment">
          <option value="현금">현금</option><option value="현대">현대</option><option value="롯데">롯데</option>
          <option value="삼성">삼성</option><option value="신한">신한</option><option value="국민">국민</option>
          <option value="하나">하나</option><option value="우리">우리</option><option value="기타">기타</option>
        </select>
      </div>
      <div class="field-row"><input type="text" id="merchant" placeholder="거래처 (예: 쿠팡)"></div>
      <div class="field-row"><input type="number" id="amount" placeholder="금액" oninput="clearErr()"><input type="date" id="date"></div>
      <div class="err" id="err"></div>
      <button class="add-btn" onclick="addItem()">추가</button>
    </div>
  </div>

  <div class="right">
    <div class="list-header">
      <span class="list-title">내역</span>
      <div class="list-head-right">
        <select class="filter" id="filter" onchange="render()"><option value="all">전체</option><option value="식비">식비</option><option value="생활비">생활비</option></select>
        <span class="list-count" id="list-count">0건</span>
      </div>
    </div>
    <div id="list"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js?v=20261005-1"></script>
</body>
</html>
